services:
  - type: web
    name: stock-prediction-api
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && cd backend-drf && python manage.py collectstatic --noinput
    startCommand: cd backend-drf && gunicorn stock_prediction_main.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: stock_prediction_main.settings
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: stock-prediction-db
          property: connectionString
    plan: free
    region: oregon

databases:
  - name: stock-prediction-db
    databaseName: stock_prediction
    user: stock_prediction_user
    plan: free